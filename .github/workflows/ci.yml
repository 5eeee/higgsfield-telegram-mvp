name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          # tests that touch load_settings() need a stub env in some code paths;
          # most tests mock config — pass minimal vars for any stragglers
          TELEGRAM_BOT_TOKEN: "0:TEST"
          HF_API_KEY: "00000000-0000-0000-0000-000000000000"
          HF_API_SECRET: "0" * 64
