# Usage on server:
#   1) Clone repo, create .env (see .env.example)
#   2) docker compose up -d --build
#   3) docker compose logs -f
#
# No HTTP port — only outbound HTTPS to Telegram + Higgsfield.
services:
  bot:
    build: .
    image: higgsfield-earth-zoom-bot:local
    restart: unless-stopped
    env_file:
      - .env
